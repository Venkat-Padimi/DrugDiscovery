[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "drug-discovery-agent"
version = "0.1.0"
description = "Agentic AI Research Platform for Biomedical Literature, Target Identification, and Target Prioritization"
authors = [{ name = "Drug Discovery Platform Team" }]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.7.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "langgraph>=0.1.0",
    "langchain-core>=0.2.0",
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "scipy>=1.12.0",
    "scikit-learn>=1.4.0",
    "mcp>=1.0.0",
    "httpx>=0.27.0",
    "requests>=2.31.0",
    "pyyaml>=6.0.1",
    "plotly>=5.20.0",
    "streamlit>=1.33.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.1.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
